version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flipping_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      POSTGRES_DB: ${POSTGRES_DB:-iphone_flipping}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./packages/database/migrations/002_price_history.sql:/docker-entrypoint-initdb.d/02_price_history.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iphone_flipping}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flipping_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: flipping_ml_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: flipping_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/${POSTGRES_DB:-iphone_flipping}
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: flipping_dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api

  scanner:
    build:
      context: .
      dockerfile: ./apps/scanner/Dockerfile
    container_name: flipping_scanner
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/${POSTGRES_DB:-iphone_flipping}
      - REDIS_URL=redis://redis:6379
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-10}
      - SCAN_QUERIES=${SCAN_QUERIES:-iphone 13,iphone 14,iphone 15,iphone 16}
      - SCAN_DELAY_BETWEEN_MODELS_MS=${SCAN_DELAY_BETWEEN_MODELS_MS:-20000}
      - MIN_ROI_THRESHOLD=${MIN_ROI_THRESHOLD:-15}
      - MIN_PROFIT_THRESHOLD=${MIN_PROFIT_THRESHOLD:-50}
      - MIN_PRICE_DROP_PCT_THRESHOLD=${MIN_PRICE_DROP_PCT_THRESHOLD:-5}
      - SCAN_MAX_PAGES=${SCAN_MAX_PAGES:-2}
      - SCAN_MIN_PRICE=${SCAN_MIN_PRICE:-80}
      - SCAN_MAX_PRICE=${SCAN_MAX_PRICE:-1200}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-true}
      - PROXY_URL=${PROXY_URL:-}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gluetun:
        condition: service_healthy

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - OPENVPN_USER=${PROTONVPN_USER}
      - OPENVPN_PASSWORD=${PROTONVPN_PASSWORD}
      - SERVER_COUNTRIES=Netherlands
      - HTTPPROXY=on
    ports:
      - 8888:8888/tcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://ipinfo.io"]
      interval: 10s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
